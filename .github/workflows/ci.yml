# CI — starter repo + scaffolded project tests.
#
# Per issue 11 the matrix started with one row (TS-monolith).
# Per issue 12 shape 2 (TS-microservices) was added.
# Per issue 13 shape 3 (go-monolith base) was added — api + contract
# only (no web until ticket 12), so the Go row runs the Go unit +
# contract tests and the TS contract-client checks, with no Playwright
# E2E yet.
# Adding a new blessed combination (issue 18) is a single config
# change: add a row to the matrix and a matching step in the
# "scaffolded project" job.
#
# Per decision 22 the test pyramid is unit + contract + one E2E
# over items. The starter repo's own tests (contract.sh + vitest)
# run first; then the CI materialises a fresh scaffolded project
# and runs its full suite including the Playwright E2E (TS shapes).

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - shape: ts-monolith
          - shape: ts-microservices
          - shape: go-monolith
          # Extensible: add `go-microservices` rows here per issue 18.

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: starter
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/starter
      JWT_SECRET: ci-test-secret-do-not-use-in-production
      JWT_SIGNING_KEY: ci-test-signing-key-do-not-use-in-production-0123456789
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Go (Go shapes)
        if: matrix.shape == 'go-monolith'
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: true

      - name: Install Taskfile
        run: |
          curl -sS https://taskfile.dev/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Install dependencies (starter)
        run: pnpm install --frozen-lockfile

      # ── Starter repo tests (contract + CLI vitest) ──────────────
      - name: Starter tests
        run: task test

      # ── Scaffolded project: materialize, install, test ──────────
      - name: Build CLI
        run: pnpm --filter create-fs-starter build

      - name: Materialize test project (${{ matrix.shape }})
        run: npx tsx ci/materialize-test-project.ts /tmp/test-project ${{ matrix.shape }}

      - name: Install dependencies (test project)
        run: pnpm install
        working-directory: /tmp/test-project

      - name: Run migrations
        run: task migrate
        working-directory: /tmp/test-project
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      # ── TS shapes: per-workspace unit tests ─────────────────────
      - name: Scaffolded project — unit tests (TS shapes)
        if: startsWith(matrix.shape, 'ts-')
        run: |
          # Continue past workspaces with no test files (vitest exits 1).
          # Only fail if a workspace has tests that actually fail.
          FAILED=0
          for ws in apps/web apps/api apps/api-auth packages/auth packages/shared packages/db; do
            echo "::group::test $ws"
            if [ -d "$ws" ] && ls "$ws"/src/**/*.test.{ts,tsx,js,jsx} >/dev/null 2>&1; then
              (cd "$ws" && pnpm test) || FAILED=1
            else
              echo "No test files — skipping"
            fi
            echo "::endgroup::"
          done
          exit $FAILED
        working-directory: /tmp/test-project
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      # ── Go shapes: unit + contract tests (decision 22) ──────────
      # The Go unit tests (repo layers over Postgres, auth shim over
      # real argon2/jwt) and the contract tests (committed
      # openapi.yaml vs the running server, schema-checking each
      # route, decision 19/22) run via task go:test; the TS contract
      # client's own tests prove the committed client is up to date
      # with the committed spec.
      - name: Scaffolded project — Go unit + contract tests
        if: matrix.shape == 'go-monolith'
        run: |
          task go:test
          pnpm --filter @starter/contract test
        working-directory: /tmp/test-project
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Scaffolded project — typecheck (compile-time contract)
        if: startsWith(matrix.shape, 'ts-')
        run: |
          for ws in packages/db packages/api-client apps/api apps/api-auth apps/web; do
            if [ -d "$ws" ]; then
              echo "::group::typecheck $ws"
              (cd "$ws" && pnpm typecheck)
              echo "::endgroup::"
            fi
          done
        working-directory: /tmp/test-project

      # ── Go shapes: build + typecheck the contract client ────────
      - name: Scaffolded project — Go build + contract client typecheck
        if: matrix.shape == 'go-monolith'
        run: |
          task go:build
          pnpm --filter @starter/contract typecheck
        working-directory: /tmp/test-project

      # ── E2E (Playwright over the items flow, decision 22) ──────
      # TS shapes only: the Go shapes' E2E arrives with the web
      # (ticket 12).
      - name: Install Playwright browsers
        if: startsWith(matrix.shape, 'ts-')
        run: pnpm exec playwright install --with-deps chromium
        working-directory: /tmp/test-project

      - name: E2E — items flow
        if: startsWith(matrix.shape, 'ts-')
        run: pnpm test:e2e
        working-directory: /tmp/test-project
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
