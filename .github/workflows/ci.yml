# CI — starter repo + scaffolded project tests.
#
# Per issue 11 the matrix started with one row (TS-monolith).
# Per issue 12 shape 2 (TS-microservices) was added.
# Per issue 13 shape 3 (go-monolith) was added — api + contract only.
# Per issue 14 (ticket 12) the Go shapes gained the Next.js web
# variant, so the Go rows now run the web unit tests, the web
# typecheck, and the one Playwright E2E exactly like the TS rows.
# Per issue 15 (shape 4 — go-microservices) the matrix gained a second
# Go row: apps/api-auth (the sole minter) + JWKS-verified apps/api.
# Every Go-step below applies to it unchanged (its Taskfile's go:test /
# go:build / migrate targets cover both Go services).
# Per issue 16 (shape 4 + AI on) a FIFTH row was added,
# go-microservices-ai. **Documented warning (decisions 24/29): AI is
# NOT in the blessed matrix.** This row exists to prove the AI-on
# composition materializes and its testable parts stay green — the AI
# service's unit tests against a FakeProvider, ruff (decision 29), the
# Go unit/contract tests including the internal/ai proxy, and the
# contract tripwires (openapi.ai.yaml == live FastAPI spec, committed
# Go client == generator output). There is no real-LLM round-trip and
# no E2E for this row (AI ships no example composition to E2E, and a
# mocked-LLM round-trip is a unit test, not a CI integration). The
# row is "generatable but not CI-tested" in the blessed sense — the
# items E2E guarantee applies only to the 4 blessed combos.
# Adding a new blessed combination (issue 18) is a single config
# change: add a row to the matrix and a matching step in the
# "scaffolded project" job.
# Per issue 18 (ticket 16), the TS rows materialize the Expo peer app.
# Expo is part of the blessed TS surface: the mobile workspace is
# typechecked, and a separate smoke step boots the API and exercises the
# secure-storage + Bearer + body-refresh flow without an emulator.
#
# Per decision 22 the test pyramid is unit + contract + one E2E
# over items. The starter repo's own tests (contract.sh + vitest)
# run first; then the CI materialises a fresh scaffolded project
# and runs its full suite including the Playwright E2E.
#
# Caching (issue 38): the scaffolded project has no committed
# lockfile, so setup-node/setup-go's default caches (keyed on the
# starter repo's own lockfiles) never cover its deps. All caches are
# keyed on the materializer source tree — the deterministic input to
# every scaffolded project's package.json / go.mod / pyproject.toml —
# so a template change busts the key exactly when the dep set can
# change.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - shape: ts-monolith
            backend: ts
          - shape: ts-microservices
            backend: ts
          - shape: go-monolith
            backend: go
          - shape: go-microservices
            backend: go
          # Issue #16: shape 4 + AI on. Documented warning (decisions
          # 24/29): AI is generatable but NOT CI-tested in the blessed
          # sense — this row proves the composition materializes and
          # its unit-tested parts (mocked provider, ruff, contract
          # tripwires) stay green. No E2E runs for this row (the E2E
          # steps skip when matrix.ai is true).
          - shape: go-microservices-ai
            backend: go
            # String, not YAML boolean: the step guards compare
            # matrix.ai == 'true' — GitHub's loose equality coerces
            # 'true' -> true, but a YAML boolean would depend on
            # runtime type coercion. A string is unambiguous.
            ai: 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: starter
        ports:
          - 5432:5432
        # Postgres is ready in ~5s; with a 10s interval the container
        # step waited ~15s per job (issue 38). Check every 5s after a
        # 5s grace period instead.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
          --health-start-period 5s

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/starter
      JWT_SECRET: ci-test-secret-do-not-use-in-production
      JWT_SIGNING_KEY: ci-test-signing-key-do-not-use-in-production-0123456789
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── Caches for the scaffolded project's dependencies ─────────
      # The test project's deps (pnpm store, Go modules, Playwright
      # browsers) are keyed on the materializer source tree below, so
      # they bust exactly when a template change can alter them. The
      # store/module caches are shape-keyed so each shape's snapshot
      # accumulates independently (a shared key would freeze the first
      # writer's snapshot forever). Playwright browsers are identical
      # across shapes and shared. restore-keys reuse the previous
      # snapshot after a bust, so unchanged deps stay cached.
      - name: Cache pip (AI-on row)
        if: matrix.ai == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('packages/cli/src/**') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Cache pnpm store (${{ matrix.shape }})
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ matrix.shape }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'packages/cli/package.json', 'packages/cli/src/**') }}
          restore-keys: |
            pnpm-store-${{ matrix.shape }}-${{ runner.os }}-

      - name: Cache Go modules (${{ matrix.shape }})
        if: matrix.backend == 'go'
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ matrix.shape }}-${{ runner.os }}-${{ hashFiles('packages/cli/src/**') }}
          restore-keys: |
            go-mod-${{ matrix.shape }}-${{ runner.os }}-

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/cli/src/**') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Setup Go (Go shapes)
        if: matrix.backend == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: true

      - name: Install Taskfile
        run: |
          curl -sS https://taskfile.dev/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Install dependencies (starter)
        run: pnpm install --frozen-lockfile

      # ── Starter repo tests (contract + CLI vitest) ──────────────
      - name: Starter tests
        run: task test

      # ── Scaffolded project: materialize, install, test ──────────
      - name: Build CLI
        run: pnpm --filter create-fs-starter build

      - name: Materialize test project (${{ matrix.shape }})
        run: npx tsx ci/materialize-test-project.ts /tmp/test-project ${{ matrix.shape }}

      - name: Install dependencies (test project)
        run: pnpm install
        working-directory: /tmp/test-project

      # ── AI-on row: install the Python service's deps (venv) ───────
      # The AI service is materialized only for shape 4 + AI on; the
      # venv powers dev:ai, ai:test, ai:lint and the contract
      # generation step below.
      - name: Install AI service deps (AI-on row)
        if: matrix.ai == 'true'
        run: task ai:install
        working-directory: /tmp/test-project

      - name: Run migrations
        run: task migrate
        working-directory: /tmp/test-project
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      # ── TS shapes: per-workspace unit tests ─────────────────────
      - name: Scaffolded project — unit tests (TS shapes)
        if: matrix.backend == 'ts'
        run: |
          # Continue past workspaces with no test files (vitest exits 1).
          # Only fail if a workspace has tests that actually fail.
          FAILED=0
          for ws in apps/web apps/api apps/api-auth packages/auth packages/shared packages/db; do
            echo "::group::test $ws"
            if [ -d "$ws" ] && ls "$ws"/src/**/*.test.{ts,tsx,js,jsx} >/dev/null 2>&1; then
              (cd "$ws" && pnpm test) || FAILED=1
            else
              echo "No test files — skipping"
            fi
            echo "::endgroup::"
          done
          exit $FAILED
        working-directory: /tmp/test-project
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      # ── Go shapes: unit + contract + web tests (decision 22) ────
      # The Go unit tests (repo layers over Postgres, auth shim over
      # real argon2/jwt), the contract tests (committed openapi.yaml
      # vs the running server, decision 19/22), the contract client's
      # own test (committed client == generator output), and the web's
      # unit test (the api-client's decision-16 auth properties).
      - name: Scaffolded project — Go unit + contract + web tests
        if: matrix.backend == 'go'
        run: |
          task go:test
          pnpm --filter @starter/contract test
          pnpm --filter @starter/web test
        working-directory: /tmp/test-project
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Scaffolded project — typecheck (compile-time contract)
        if: matrix.backend == 'ts'
        run: |
          for ws in packages/db packages/api-client apps/api apps/api-auth apps/web apps/mobile; do
            if [ -d "$ws" ]; then
              echo "::group::typecheck $ws"
              (cd "$ws" && pnpm typecheck)
              echo "::endgroup::"
            fi
          done
        working-directory: /tmp/test-project

      # ── Go shapes: build + typecheck the contract client + web ──
      - name: Scaffolded project — Go build + typecheck (contract + web)
        if: matrix.backend == 'go'
        run: |
          task go:build
          pnpm --filter @starter/contract typecheck
          pnpm --filter @starter/web typecheck
        working-directory: /tmp/test-project

      # ── Expo mobile smoke test (TS shapes, issue 18) ─────────────
      # The native app cannot run in an ubuntu CI job without an emulator,
      # so this is the documented minimum smoke surface: compile the Expo
      # workspace above, boot the real API services, and run the mobile
      # auth flow against them. ACCESS_TOKEN_TTL=1 forces a real 401 so
      # the test proves body refresh and secure-storage token rotation.
      - name: Scaffolded project — Expo mobile auth smoke test
        if: matrix.backend == 'ts'
        run: |
          nohup task dev:api >/tmp/mobile-api.log 2>&1 &
          if [ "${{ matrix.shape }}" = "ts-microservices" ]; then
            nohup task dev:api-auth >/tmp/mobile-api-auth.log 2>&1 &
          fi
          READY=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            exit 1
          fi
          if [ "${{ matrix.shape }}" = "ts-microservices" ]; then
            READY_AUTH=0
            for i in $(seq 1 60); do
              if curl -fsS http://localhost:3001/health >/dev/null 2>&1; then
                READY_AUTH=1
                break
              fi
              sleep 1
            done
            if [ "$READY_AUTH" -ne 1 ]; then
              exit 1
            fi
          fi
          pnpm --filter @starter/mobile test
        working-directory: /tmp/test-project
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          ACCESS_TOKEN_TTL: '1'
          EXPO_PUBLIC_API_URL: http://localhost:3000
          EXPO_PUBLIC_AUTH_URL: http://localhost:3001
          MOBILE_SMOKE_API_URL: http://localhost:3000
          MOBILE_SMOKE_AUTH_URL: http://localhost:3001

      # ── AI-on row: the AI service's own suite (decisions 29) ──────
      # Unit tests against a FakeProvider (a mocked-LLM round-trip is
      # a unit test, not a CI integration) + the contract tripwire
      # (committed openapi.ai.yaml == live FastAPI spec) + ruff lint
      # (decision 29's one-tool discipline).
      - name: Scaffolded project — AI unit + contract tests + ruff (AI-on row)
        if: matrix.ai == 'true'
        run: |
          task ai:test
          task ai:lint
        working-directory: /tmp/test-project

      # ── E2E (Playwright over the items flow, decision 22) ──────
      # Every blessed combo ships the one E2E: the web (Vite or Next)
      # composes with the api and Postgres through a real browser.
      # Browser cache hits skip the apt install-deps entirely (that's
      # the slow half of --with-deps); on a miss both halves run.
      # The AI-on row SKIPS the E2E entirely (decisions 24/29: AI is
      # generatable but not CI-tested; the items-E2E guarantee applies
      # to the 4 blessed combos only).
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true' && matrix.ai != 'true'
        run: pnpm exec playwright install-deps chromium
        working-directory: /tmp/test-project

      - name: Install Playwright browsers
        if: matrix.ai != 'true'
        run: pnpm exec playwright install chromium
        working-directory: /tmp/test-project

      - name: E2E — items flow
        if: matrix.ai != 'true'
        run: pnpm test:e2e
        working-directory: /tmp/test-project
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
